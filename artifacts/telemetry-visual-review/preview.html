<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Totem Park — revisão visual</title><link rel="stylesheet" href="../../src/App.css"><style>
body{margin:0;background:#071123;color:#e8eefb;font:14px Arial,sans-serif;padding:22px}.review-label{color:#9bb1d0;margin-bottom:12px;font-size:12px}.review-shell{max-width:1500px;margin:auto}.baseline .telemetry-hero{padding:28px}.baseline .telemetry-hero h1{font-size:3rem}.baseline .telemetry-kpis article{min-height:128px;padding:20px}.baseline .telemetry-kpis strong{font-size:1.9rem}.baseline .telemetry-page .telemetry-hero{padding:28px}.baseline .telemetry-page .telemetry-hero h1{font-size:3rem}.baseline .telemetry-page .telemetry-kpis article{min-height:128px;padding:20px}.baseline .telemetry-page .telemetry-kpis strong{font-size:1.9rem}.baseline .telemetry-visuals{display:none}.baseline .telemetry-bars{display:block}.telemetry-bars{display:none}.realtime .premium-panel{background:#0d1931;border:1px solid #24375d;border-radius:20px;padding:20px}.realtime .premium-panel-header{display:flex;justify-content:space-between;align-items:center;gap:20px}.realtime .premium-panel-header h2{margin:0}.realtime .premium-screen-list{margin-top:20px}.realtime .premium-screen-row{margin-bottom:12px}.realtime .premium-screen-text{min-width:0}.realtime .premium-screen-text strong{font-size:16px}.realtime .premium-screen-text span{overflow-wrap:normal}.realtime .manager-now-playing{display:grid;gap:3px;margin-top:10px;color:#91a4ca}.realtime .manager-now-playing b{color:#dce7fa}.realtime .manager-screen-status-col{width:360px}.realtime .premium-screen-icon{font-size:24px}.realtime .premium-screen-dot{flex-shrink:0}@media(max-width:700px){body{padding:12px}.realtime .premium-panel-header{align-items:flex-start;flex-direction:column}.realtime .premium-screen-row{grid-template-columns:10px 32px 1fr;gap:8px}.realtime .premium-screen-icon{width:32px;height:32px}.realtime .manager-screen-status-col{grid-column:1/-1;width:100%}}
</style></head><body><div class="review-shell"><div class="review-label">PRÉVIA PARA APROVAÇÃO VISUAL · DADOS DE EXEMPLO · NÃO PUBLICADA</div><main id="app"></main></div><script>
const view=new URL(location.href).searchParams.get('view')||'corrected';document.body.classList.add(view==='approved'?'baseline':view);
const app=document.getElementById('app');
const pills='<button class="active">Todas 12</button><button class="online">Online 8</button><button class="warning">Atenção 1</button><button class="warning">Logada offline 2</button><button class="offline">Não logada 1</button>';
if(view==='realtime'){
 app.innerHTML=`<section class="realtime"><div class="premium-panel"><div class="premium-panel-header"><div><h2>Telas em tempo real</h2><p>Monitoramento rápido das TVs conectadas.</p></div><div class="premium-screen-summary">${pills}</div></div><div class="premium-screen-list">${[
 ['TV Teste','ONLINE','online','TV · Google TV','26/09/2026 · 00:52','ATIVA','6 min'],
 ['Recepção','ATENÇÃO','logged-offline','TV · Android','—','DADOS DESATUALIZADOS','—'],
 ['Painel Lobby','LOGADA OFFLINE','logged-offline','TV · Android','21/09/2026 · 14:10','DESATIVADA','—']
 ].map(([name,status,kind,device,linked,telemetry,active])=>`<div class="premium-screen-row"><span class="premium-screen-dot ${kind==='online'?'online':'offline'}"></span><div class="premium-screen-icon">▣</div><div class="premium-screen-text"><strong>${name}</strong><span>Kimura AG · São Paulo</span><div class="manager-now-playing"><small>Playlist teste</small><b>Vídeo A / Vídeo B</b><span>Cache: pronto · Local</span></div></div><div class="manager-screen-status-col"><div class="premium-live-badge ${kind}">${status}</div><span>${device}</span><span>Login: 26/09/2026</span><span>Última comunicação: há 30 s</span><span>Vinculada desde: ${linked}</span><span>App: Operational V1</span><span class="manager-telemetry-badge">Telemetria: ${telemetry}</span><span>Tempo ativo: ${active}</span><span>Reprodução: Não instrumentado</span><span>Local: São Paulo</span><span>Item: 1/2</span></div></div>`).join('')}</div></div></section>`;
}else{
 const approved=view==='approved';
 const kpi=[['Telas online','8'],['Telas em atenção','1'],['Telas offline','3'],['Telemetria ativa','1'],['Aguardando sinal','0'],['Tempo ativo','6 min']];
 app.innerHTML=`<section class="telemetry-page"><header class="telemetry-hero"><div><span>Monitoramento 2A.2-C</span><h1>Telemetria operacional</h1></div><div class="telemetry-live"><i></i>Piloto ativo</div></header><div class="telemetry-filters"><select><option>Hoje</option></select><select><option>Todos os clientes</option></select><select><option>Todas as telas</option></select><select><option>Todos os status</option></select><select><option>Todas as versões</option></select></div><details class="telemetry-config"><summary>Ativação piloto <b>ATIVA</b></summary></details><div class="telemetry-kpis">${kpi.map(([name,value],i)=>`<article class="${i===0?'primary':''}"><span>${name}</span><strong>${value}</strong></article>`).join('')}</div>${approved?'<div class="telemetry-bars"><h2>Local First</h2><div>Local: 8</div><div class="remote">Remota: 0</div></div>':`<div class="telemetry-visuals"><section class="telemetry-chart"><h2>Status das telas</h2><div class="telemetry-status-bars"><span class="online" style="width:67%"></span><span class="attention" style="width:8%"></span><span class="offline" style="width:25%"></span></div><p>8 online · 1 atenção · 3 offline</p></section><section class="telemetry-chart"><h2>Versões instaladas</h2><p class="telemetry-version"><span>Operational Telemetry V1</span><b>1</b></p></section><section class="telemetry-chart"><h2>Origem da reprodução</h2><p class="telemetry-chart-empty">Não instrumentado</p></section><section class="telemetry-chart"><h2>Tráfego e cache</h2><p class="telemetry-chart-empty">Não instrumentado</p></section><section class="telemetry-chart"><h2>Tempo de exibição</h2><p class="telemetry-chart-empty">Não instrumentado</p></section><section class="telemetry-chart"><h2>Transferências</h2><p class="telemetry-chart-empty">Não instrumentado</p></section></div>`}<div class="telemetry-table telemetry-v1-table"><div class="head"><span>Tela</span><span>Status da tela</span><span>Telemetria</span><span>Origem</span><span>Tempo ativo</span><span>Último sinal</span><span>Vinculada desde</span><span>Erros</span></div>${[['TV Teste','ONLINE','ATIVA','6 min','há 30 s','26/09/2026, 00:52'],['Recepção','ATENÇÃO','DADOS DESATUALIZADOS','—','há 1 min','—'],['Painel Lobby','OFFLINE','DESATIVADA','—','há 3 h','21/09/2026, 14:10']].map(([name,status,telemetry,time,signal,linked])=>`<button><span><strong>${name}</strong><small>Kimura AG</small></span><span class="status ${status.toLowerCase()}">${status}</span><span class="telemetry-flag">${telemetry}</span><span>—</span><span>${time}</span><span>${signal}</span><span>${linked}</span><span>—</span></button>`).join('')}</div></section>`;
}
</script></body></html>
