apply plugin: 'com.android.application'

android {
    namespace = "br.com.parksolutions.totempark"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "br.com.parksolutions.totempark"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        manifestPlaceholders = [
            appLabel: "Totem Park",
            tvLauncherEnabled: "false"
        ]
    }
    flavorDimensions "appMode"
    productFlavors {
        web {
            dimension "appMode"
            applicationIdSuffix ".manager"
            versionNameSuffix "-manager"
            manifestPlaceholders = [
                appLabel: "Totem Park Gestor",
                tvLauncherEnabled: "false"
            ]
        }
        player {
            dimension "appMode"
            versionNameSuffix "-player"
            manifestPlaceholders = [
                appLabel: "Totem Park Player",
                tvLauncherEnabled: "true"
            ]
        }
        playerTest {
            dimension "appMode"
            applicationIdSuffix ".playertest"
            versionNameSuffix "-player-test"
            manifestPlaceholders = [
                appLabel: "Totem Park Player Teste",
                tvLauncherEnabled: "true"
            ]
        }
        playerLab {
            dimension "appMode"
            applicationIdSuffix ".player.lab"
            versionNameSuffix "-player-lab-2a2-a"
            manifestPlaceholders = [
                appLabel: "Totem Park Player LAB 2A.2-A",
                tvLauncherEnabled: "true"
            ]
        }
        playerCanary {
            dimension "appMode"
            applicationIdSuffix ".player.canary"
            versionNameSuffix "-player-canary-2a2-a"
            manifestPlaceholders = [
                appLabel: "Totem Park Player CANARY 2A.2-A",
                tvLauncherEnabled: "true"
            ]
        }
        playerRc {
            dimension "appMode"
            versionCode 30
            versionName "1.0.0-v30-traffic-telemetry-final-rc"
            manifestPlaceholders = [
                appLabel: "Totem Park Player",
                tvLauncherEnabled: "true"
            ]
        }
        playerPhaseB {
            dimension "appMode"
            applicationIdSuffix ".player.phaseb"
            versionCode 2
            versionName "1.0-player-2a2-b-audit2"
            manifestPlaceholders = [
                appLabel: "Totem Park Player 2A.2-B",
                tvLauncherEnabled: "true"
            ]
        }
        playerLinkFix {
            dimension "appMode"
            applicationIdSuffix ".player.linkfix"
            versionCode 1
            versionName "1.0-player-link-fix-audit"
            manifestPlaceholders = [
                appLabel: "Totem Park Player LINK-FIX AUDIT",
                tvLauncherEnabled: "true"
            ]
        }
        playerLoopAudit {
            dimension "appMode"
            applicationIdSuffix ".player.loopaudit"
            versionCode 1
            versionName "1.0-player-single-loop-audit"
            manifestPlaceholders = [
                appLabel: "Totem Park Player LOOP AUDIT",
                tvLauncherEnabled: "true"
            ]
        }
        playerTelemetry {
            dimension "appMode"
            applicationIdSuffix ".player.telemetry"
            versionCode 1
            versionName "1.0-player-2a2-c-telemetry-pilot"
            manifestPlaceholders = [
                appLabel: "Totem Park Player TELEMETRIA",
                tvLauncherEnabled: "true"
            ]
        }
        playerJumpDiag {
            dimension "appMode"
            applicationIdSuffix ".player.jumpdiag"
            versionCode 1
            versionName "1.0-player-jump-diagnostic"
            manifestPlaceholders = [
                appLabel: "Totem Park Player JUMP DIAG",
                tvLauncherEnabled: "true"
            ]
        }
        playerDecoderExperiment {
            dimension "appMode"
            applicationIdSuffix ".player.decoderexperiment"
            versionCode 2
            versionName "1.0-player-decoder-experiment-export2"
            manifestPlaceholders = [
                appLabel: "Totem Park Player DECODER EXP",
                tvLauncherEnabled: "true"
            ]
        }
        playerRollback {
            dimension "appMode"
            versionCode 11
            versionName "1.0.0-2a2-rc4-rollback-rc5"
            manifestPlaceholders = [
                appLabel: "Totem Park Player",
                tvLauncherEnabled: "true"
            ]
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
